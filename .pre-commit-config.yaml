repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check --no-fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: Mypy
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
        types: [python]
      - id: architecture
        name: Import architecture
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]
