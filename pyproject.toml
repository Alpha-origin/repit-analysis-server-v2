[project]
name = "analysis-question-server"
version = "0.1.0"
description = "Analysis question server (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.109.1",   # strict tool schema 변환을 지원하는 공식 Python SDK
    "dishka>=1.10.1",       # 의존성 주입(Dependency Injection, DI) 라이브러리
    "fastapi>=0.136.3",     # 비동기 기반 Python 웹 API 프레임워크
    "httpx>=0.27.0",        # HTTP 클라이언트 (API 호출, 외부 서비스 연동)
    "pillow>=10.4.0",       # 이미지 처리 라이브러리 (리사이즈, 포맷 변환 등)
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",    # 환경 변수 및 설정 관리 라이브러리
    "pymupdf>=1.24.0",              # PDF 문서 읽기 및 텍스트/이미지 추출
    "uvicorn[standard]>=0.49.0",    # FastAPI 실행용 ASGI 서버 (고성능 웹 서버)
]

[dependency-groups]
dev = [
    "coverage>=7.14.1",
    "deptry>=0.25.1",
    "import-linter>=2.11",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# -----------------------------
# Ruff
# -----------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
fix = true
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "C90",   # mccabe
    "E",     # pycodestyle error
    "F",     # pyflakes
    "FAST",  # FastAPI
    "I",     # isort
    "ISC",   # implicit-str-concat
    "N",     # pep8-naming
    "PERF",  # Perflint
    "PL",    # pylint
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "RUF",   # Ruff-specific
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "T20",   # flake8-print
    "TC",    # flake8-type-checking
    "UP",    # pyupgrade
    "W",     # pycodestyle warning
]
ignore = [
    "PLR0913", # too-many-arguments
    "TC001",   # typing-only-first-party-import
    "TC002",   # typing-only-third-party-import
    "TC003",   # typing-only-standard-library-import
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",   # assert
    "PLR2004", # magic-value
]

# -----------------------------
# Mypy
# -----------------------------
[tool.mypy]
mypy_path = ["src"]
files = ["src", "tests"]
python_version = "3.12"
strict = true
pretty = true
follow_imports = "silent"
ignore_missing_imports = true
warn_unreachable = true
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "unused-awaitable",
    "ignore-without-code",
]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

# -----------------------------
# Pytest
# -----------------------------
[tool.pytest.ini_options]
addopts = ["--color=yes", "-pno:cacheprovider"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow"]

# -----------------------------
# Coverage
# -----------------------------
[tool.coverage.run]
relative_files = true
source = ["src"]
omit = [
    "**/__init__.py",
    "src/app/main/**",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "@abc\\.abstractmethod",
    "\\.\\.\\.",
    "^\\s*raise\\s*$",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "pass",
]

# -----------------------------
# Deptry
# -----------------------------
[tool.deptry]
root = ["src"]
ignore = ["DEP002", "DEP003"]

# -----------------------------
# Import Linter — Clean Architecture
# -----------------------------
[tool.importlinter]
root_package = "app"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "clean-architecture"
name = "inner must not import outer"
type = "layers"
containers = ["app"]
layers = [
    "(main)",
    "inbound",
    "outbound",
    "core",
]

[[tool.importlinter.contracts]]
id = "cqrs-common-must-not-import-commands"
name = "cqrs: common must not import commands"
type = "forbidden"
source_modules = ["app.core.common"]
forbidden_modules = ["app.core.commands"]

[[tool.importlinter.contracts]]
id = "cqrs-common-must-not-import-queries"
name = "cqrs: common must not import queries"
type = "forbidden"
source_modules = ["app.core.common"]
forbidden_modules = ["app.core.queries"]

[[tool.importlinter.contracts]]
id = "cqrs-commands-must-not-import-queries"
name = "cqrs: commands must not import queries"
type = "forbidden"
source_modules = ["app.core.commands"]
forbidden_modules = ["app.core.queries"]

[[tool.importlinter.contracts]]
id = "cqrs-queries-must-not-import-commands"
name = "cqrs: queries must not import commands"
type = "forbidden"
source_modules = ["app.core.queries"]
forbidden_modules = ["app.core.commands"]
